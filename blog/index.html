<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#150C24',
                        surface: '#1F1330',
                        surface2: '#2A1840',
                        flame: { DEFAULT: '#FF6A2B', dark: '#E85A1E' },
                        blush: '#FF2D8B',
                    },
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    borderRadius: { '4xl': '28px' },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #150C24;
            color: #F3EEF8;
            -webkit-font-smoothing: antialiased;
        }

        .zh-reading { line-height: 1.8; word-break: break-word; }

        .reveal { opacity: 1; }
        @supports (animation-timeline: view()) {
            @media (prefers-reduced-motion: no-preference) {
                .reveal {
                    opacity: 0;
                    animation: reveal-in linear both;
                    animation-timeline: view();
                    animation-range: entry 0% entry 35%;
                }
            }
        }
        @keyframes reveal-in {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: none; }
        }

        .btn { transition: transform .15s ease, background-color .2s ease, color .2s ease, border-color .2s ease; }
        .btn:active { transform: scale(.98); }

        ::selection { background: #FF6A2B; color: #150C24; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 sm:pb-0">

    <!-- 導覽列 -->
    <header class="sticky top-0 z-50 bg-ink/80 backdrop-blur-md border-b border-white/10">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">

                VibeSync<span class="w-2 h-2 rounded-full bg-flame inline-block mb-3"></span>

            <a href="/blog/ghosting-strategy" class="block group reveal">
                <article class="rounded-[28px] bg-surface border border-white/10 p-6 md:p-7 transition-colors group-hover:border-flame/40">
                    <div class="flex items-start gap-5">
                        <div class="w-14 h-14 shrink-0 rounded-2xl bg-flame/15 flex items-center justify-center">
                            <i class="ph ph-chats-circle text-3xl text-flame"></i>

                        <div class="flex-1 min-w-0">

                            <p class="text-white/60 text-sm zh-reading">
                                連續發問「在忙嗎？」只會摧毀吸引力。聰明人會先用 VibeSync 進行對話診斷，讓 AI 判斷 Game Stage，精準給出破冰策略。
                            </p>
                            <div class="flex items-center gap-3 mt-4 text-xs text-white/45 font-bold">
                                <span>2026 年 4 月</span>
                                <span>·</span>
                                <span class="text-flame group-hover:text-flame-dark transition-colors">閱讀全文 →</span>
                            </div>
                        </div>
                    </div>

            </a>
        </div>

    </main>

    <footer class="bg-[#0E0719] border-t border-white/10 mt-16">
        <div class="max-w-3xl mx-auto px-6 py-10 flex flex-col items-center gap-4">
            <div class="flex gap-5 text-[13px] font-bold text-white/55 tracking-wide">
